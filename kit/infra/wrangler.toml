# Cloudflare Pages project config. Seams: name, database ids/names, bucket.
name = "myapp"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "myapp-db"
database_id = "PRODUCTION_D1_ID"

# Preview deployments (non-main branches) get an isolated world: their own D1
# (and R2 if the app has one) plus the dev-token login bypass. Managed by
# scripts/setup-preview.sh; the DEV_AUTH var is what makes the bypass live,
# and only here - never in the top-level [vars].
[env.preview.vars]
DEV_AUTH = "allow"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "myapp-db-preview"
database_id = "PREVIEW_D1_ID"
