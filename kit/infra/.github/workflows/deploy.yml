# Deploy one PWA to its Cloudflare Pages project on every push, any branch.
# main → production; other branches → preview deployments (which bind the
# isolated preview D1/R2 from wrangler.toml [env.preview], never production).
# Seams: the paths filter, working-directory, project name. In a repo with
# two apps, copy this per app and include shared/** in each paths list.
name: Deploy app to Cloudflare Pages

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build number (commit count) is correct
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name myapp --branch ${{ github.ref_name }}
